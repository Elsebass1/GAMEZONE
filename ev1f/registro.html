<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login-container">
        <h2>Crear Cuenta</h2>
        
        <form id="registroForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre Completo *</label>
                <input type="text" id="nombre" maxlength="100" placeholder="Ej. Juan Pérez">
                <span id="error-nombre" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico *</label>
                <input type="email" id="correo" maxlength="60" placeholder="usuario@duoc.cl">
                <span id="error-correo" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 10 caracteres">
                <span id="error-password" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña *</label>
                <input type="password" id="confirmPassword">
                <span id="error-confirmPassword" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (Opcional)</label>
                <input type="tel" id="telefono" placeholder="+56912345678">
                <span id="error-telefono" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label>Género Favorito *</label>
                <div class="radio-group">
                    <label><input type="radio" name="genero" value="FICCION"> Ficción</label><br>
                    <label><input type="radio" name="genero" value="NO_FICCION"> No Ficción</label><br>
                    <label><input type="radio" name="genero" value="MISTERIO"> Misterio</label><br>
                    <label><input type="radio" name="genero" value="TERROR"> Terror</label><br>
                    <label><input type="radio" name="genero" value="SUSPENSO"> Suspenso</label><br>
                    <label><input type="radio" name="genero" value="HISTORIA"> Historia</label>
                </div>
                <span id="error-genero" class="error-msg"></span>
            </div>

            <button type="submit">Registrarme</button>
        </form>

        <p class="links-footer">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a><br>
            <a href="index.html">Volver al inicio</a>
        </p>
    </main>

    <script src="registro.js"></script>
</body>
</html>
